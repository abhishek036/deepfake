# FORGE-Lite: Forensic, Robust, Generalizable Evidence Detection for Facial Deepfake Videos
# Version: 1.0 | RTX 4060 8GB Optimized | CVPR 2027 Target

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forge-lite"
version = "1.0.0"
description = "Quality-aware, codec-consistent, foundation-adapted spatial-temporal deepfake video detector"
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AIML Cornerstone Team", email = "forge@example.com"}
]
keywords = ["deepfake", "detection", "forensics", "computer-vision", "DINO"]

dependencies = [
    # Core deep learning
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "timm>=1.0.3",
    "transformers>=4.40.0",
    # Face detection
    "facenet-pytorch>=2.5.3",
    "retinaface-pytorch>=0.0.8",
    # Landmark & physiological
    "mediapipe>=0.10.14",
    # Wavelet & signal processing
    "PyWavelets>=1.6.0",
    "scipy>=1.13.0",
    "scikit-image>=0.23.0",
    # Audio
    "librosa>=0.10.2",
    # Computer vision utilities
    "opencv-python>=4.10.0",
    "Pillow>=10.3.0",
    # Data storage
    "lmdb>=1.4.1",
    "webdataset>=0.2.86",
    # ML utilities
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    # Experiment tracking
    "wandb>=0.17.0",
    # Explainability
    "captum>=0.7.0",
    # API & demo
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "gradio>=4.36.0",
    # Visualization
    "plotly>=5.22.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # Config
    "omegaconf>=2.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
adversarial = [
    "torchattacks>=3.5.1",
]
lora = [
    "peft>=0.11.0",
]

[project.scripts]
forge-preprocess = "preprocessing.build_manifest:main"
forge-train = "training.trainer:main"
forge-eval = "evaluation.evaluate_video:main"
forge-serve = "service.api:main"
forge-demo = "app.gradio_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessing*", "models*", "training*", "evaluation*", "service*", "app*", "utils*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
]
